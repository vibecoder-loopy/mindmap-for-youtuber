<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>TubeMap — 유튜버를 위한 마인드맵</title>
<meta name="viewport" content="width=1440, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0B;
    --bg-2: #0F0F11;
    --bg-3: #16161A;
    --panel: #0F0F11;
    --panel-2: #16161A;
    --line: #1F1F23;
    --line-2: #2A2A2F;
    --ink: #F4F4F5;
    --ink-2: #B8B8BC;
    --ink-3: #6E6E74;
    --ink-4: #44444A;
    --red: #FF2D2D;
    --red-2: #FF4D4D;
    --red-soft: rgba(255, 45, 45, 0.10);
    --shadow-card: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-pop: 0 16px 40px -12px rgba(0,0,0,0.7), 0 2px 6px rgba(0,0,0,0.35);
    font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); height: 100%; overflow: hidden; }
  body { font-feature-settings: "ss01", "ss02", "tnum"; }
  ::selection { background: var(--red); color: white; }
  button { font-family: inherit; }

  /* scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2A2A2F; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #3A3A40; background-clip: padding-box; border: 2px solid transparent; }

  #root { width: 100vw; height: 100vh; }
</style>
</head>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
